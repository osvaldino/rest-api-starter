services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
        WWWUSER: '${WWWUSER:-1000}'
    image: start-kit-api/app
    container_name: start-kit-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    ports:
      - '${APP_PORT:-80}:80'
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - start-kit

  pgsql:
    image: postgres:16-alpine
    container_name: start-kit-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${DB_DATABASE:-start_kit_api}'
      POSTGRES_USER: '${DB_USERNAME:-root}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-start_kit_api}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - start-kit

networks:
  start-kit:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
