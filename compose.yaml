services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: start-kit-api/app
        pull_policy: build
        container_name: start-kit-app
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            APP_ENV: '${APP_ENV:-local}'
            APP_DEBUG: '${APP_DEBUG:-true}'
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE:-start_kit_api}'
            DB_USERNAME: '${DB_USERNAME:-root}'
            DB_PASSWORD: '${DB_PASSWORD:-secret}'
            CACHE_STORE: '${CACHE_STORE:-database}'
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:-database}'
            SESSION_DRIVER: '${SESSION_DRIVER:-database}'
        volumes:
            - '.:/var/www/html'
        networks:
            - app-network
        depends_on:
            pgsql:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'php-fpm -t || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    pgsql:
        image: 'postgres:16-alpine'
        container_name: start-kit-pgsql
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-start_kit_api}'
            POSTGRES_USER: '${DB_USERNAME:-root}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - app-network
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -q -d ${DB_DATABASE:-start_kit_api} -U ${DB_USERNAME:-root}
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

networks:
    app-network:
        driver: bridge

volumes:
    pgsql-data:
        driver: local
